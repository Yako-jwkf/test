    - {item_id: I-scope, delegated_to: requirement_agent, decision_bounds: "同上。ただし C3(原文は1件ずつ同意したものだけ test に置く)は利用者の確認済みなので変えない", source_span: "もういいです、全権限渡します。考えて適当にしてください。"}
    - {item_id: D3, delegated_to: requirement_agent, decision_bounds: "同上", source_span: "もういいです、全権限渡します。考えて適当にしてください。"}
    - {item_id: S1, delegated_to: requirement_agent, decision_bounds: "同上", source_span: "もういいです、全権限渡します。考えて適当にしてください。"}
    - {item_id: S2, delegated_to: requirement_agent, decision_bounds: "同上", source_span: "もういいです、全権限渡します。考えて適当にしてください。"}
    - {item_id: U-term, delegated_to: requirement_agent, decision_bounds: "同上", source_span: "もういいです、全権限渡します。考えて適当にしてください。"}
    - {item_id: U-order, delegated_to: requirement_agent, decision_bounds: "同上。決めた順: R1(集める範囲)→R6(台帳)→R7(未使用の事例で確かめる)を先に。R9(再利用)は確かめた後。R11・R12 はずっと守る", source_span: "もういいです、全権限渡します。考えて適当にしてください。"}


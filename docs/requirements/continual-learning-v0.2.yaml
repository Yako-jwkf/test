    - {value: "過去の会話は list_sessions・list_events で読める(50件、2026-09-30〜10-11)。4件の読み出しに136回かかった", state: research_informed, source_span: none}
    - {value: "サーバーの記録の result の欄は、停止フックが動いたターンでは画面の本文と違う", state: research_informed, source_span: none}
